services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: grid_print
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grid_print']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '0.0.0.0:9000:9000'
      - '0.0.0.0:9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: npm run migration:run:prod
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: grid_print
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SYNCHRONIZE: 'false'
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: grid_print
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SYNCHRONIZE: 'false'
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: grid-print
      MINIO_USE_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ROUTING_BASE_URL: ${ROUTING_BASE_URL:-}
      ROUTING_PROFILE: ${ROUTING_PROFILE:-driving}
      ROUTING_TIMEOUT_MS: ${ROUTING_TIMEOUT_MS:-5000}
      GRIDGO_STORE_LATITUDE: ${GRIDGO_STORE_LATITUDE:-7.064}
      GRIDGO_STORE_LONGITUDE: ${GRIDGO_STORE_LONGITUDE:-125.6079}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
