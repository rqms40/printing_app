server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf|json|wasm)$ {
    try_files $uri =404;
    access_log off;
    expires 1h;
    add_header Cache-Control "public";
  }
}
