name: printing_app
description: "GRID - Premium printing service delivery app"
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Maps & Location (flutter_map + OSM — free, no API key)
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # UI & Animation
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  hugeicons: ^1.1.5
  flutter_3d_controller: ^2.2.0
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  audioplayers: ^6.1.0

  # File handling
  file_picker: ^8.1.6
  pdfx: ^2.8.0

  # Persistence
  shared_preferences: ^2.3.4

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.3
  path_provider: ^2.1.5

  # Polyline decoding (for OSRM route geometry)
  google_polyline_algorithm: ^3.1.0
  http: ^1.2.2

  # HTTP client
  dio: ^5.7.0

  # WebSocket
  socket_io_client: ^3.0.2

  # Networking & Utilities
  connectivity_plus: ^6.1.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  image_picker: ^1.2.1

  # Markdown rendering (for bot messages)
  flutter_markdown: ^0.7.5

  # Tutorial system
  tutorial_coach_mark: ^1.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-Bold.ttf
          weight: 700
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif/InstrumentSerif-Regular.ttf
          weight: 400
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
