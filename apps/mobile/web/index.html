<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GRID - Premium printing service delivery">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GRID">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GRID</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase JS SDK for web push notifications -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    AudioContext Unlock — Chrome and Safari block Web Audio until a user
    gesture. This script listens for the very first interaction anywhere
    on the page and resumes every suspended AudioContext, including the
    one created by Flutter's audioplayers package. Once unlocked it
    removes itself so there is zero ongoing overhead.
  -->
  <script>
    (function () {
      var unlocked = false;

      function unlock() {
        if (unlocked) return;
        unlocked = true;

        // Resume every AudioContext that currently exists or will exist
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        // Resume any already-created contexts (e.g. from audioplayers)
        if (window._flutter_audio_ctx) {
          window._flutter_audio_ctx.resume();
        }

        // Patch the constructor so any future AudioContext starts resumed
        var OriginalAudioContext = AudioContext;
        window.AudioContext = window.webkitAudioContext = function () {
          var ctx = new OriginalAudioContext();
          ctx.resume();
          window._flutter_audio_ctx = ctx;
          return ctx;
        };

        // Remove listeners — job done
        ['click', 'touchstart', 'touchend', 'keydown', 'pointerdown'].forEach(function (evt) {
          document.removeEventListener(evt, unlock, true);
        });
      }

      ['click', 'touchstart', 'touchend', 'keydown', 'pointerdown'].forEach(function (evt) {
        document.addEventListener(evt, unlock, { capture: true, once: false, passive: true });
      });
    })();
  </script>
</body>
</html>
