name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build (e.g. v1.10.1)
        required: true
        type: string
      skip_gate:
        description: Skip main/CI/evidence gate (demo/emergency signed APK only)
        required: true
        type: boolean
        default: true
      server_url:
        description: Compile-time SERVER_URL for physical device installs
        required: false
        type: string
        default: "https://gridgo-legacy.talasora.com"

permissions: {}

jobs:
  gate:
    name: Release Gate
    if: ${{ github.event_name == 'push' || inputs.skip_gate != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      visual_run_id: ${{ steps.workflows.outputs.visual_run_id }}
      evidence_artifact_name: ${{ steps.workflows.outputs.evidence_artifact_name }}

    steps:
      - name: Check out tagged commit with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate tag, version, and exact main SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          pubspec_version="$(awk '/^version:/ { print $2; exit }' apps/mobile/pubspec.yaml)"
          test -n "$pubspec_version"
          test "$GITHUB_REF_NAME" = "v${pubspec_version%%+*}"

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          release_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$release_sha" = "$(git rev-parse HEAD)"
          test "$release_sha" = "$(git rev-parse refs/remotes/origin/main)"
          test "$release_sha" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA required workflow runs
        id: workflows
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail

          wait_for_run() {
            local workflow="$1"
            local event="$2"
            local expected_jobs="$3"
            local run_json=""
            for _ in $(seq 1 540); do
              runs="$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                -f branch=main -f event="$event" -f head_sha="$RELEASE_SHA" -f per_page=100)"
              run_json="$(jq -c --arg sha "$RELEASE_SHA" --arg event "$event" '
                [.workflow_runs[]
                  | select(.head_sha == $sha and .head_branch == "main" and .event == $event)]
                | sort_by(.created_at) | last // empty
              ' <<< "$runs")"
              if [[ -n "$run_json" ]] && \
                 [[ "$(jq -r '.status' <<< "$run_json")" == completed ]] && \
                 [[ "$(jq -r '.conclusion' <<< "$run_json")" == success ]]; then
                run_id="$(jq -r '.id' <<< "$run_json")"
                run_attempt="$(jq -r '.run_attempt' <<< "$run_json")"
                jobs="$(gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}/jobs" \
                  -f per_page=100)"
                all_jobs_green=1
                IFS=',' read -r -a required_jobs <<< "$expected_jobs"
                for job_name in "${required_jobs[@]}"; do
                  if ! jq -e --arg name "$job_name" '
                    [.jobs[] | select(.name == $name and .status == "completed" and .conclusion == "success")]
                    | length == 1
                  ' <<< "$jobs" > /dev/null; then
                    all_jobs_green=0
                  fi
                done
                if [[ "$all_jobs_green" == 1 ]]; then
                  printf '%s' "$run_json"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "No successful exact-SHA ${event} run for ${workflow} with jobs ${expected_jobs}" >&2
            return 1
          }

          required=(
            "ci-server.yml:Server,Migration"
            "ci-admin.yml:Admin"
            "ci-mobile.yml:Mobile"
            "ci-landing.yml:Landing"
            "ci-mobile-web-e2e.yml:Mobile Web E2E"
            "ci-fresh-stack.yml:Fresh Stack"
          )
          for requirement in "${required[@]}"; do
            workflow="${requirement%%:*}"
            jobs="${requirement#*:}"
            run="$(wait_for_run "$workflow" push "$jobs")"
            echo "Validated $workflow run $(jq -r '.id' <<< "$run") for $RELEASE_SHA"
          done

          visual_run="$(wait_for_run visual-evidence.yml workflow_dispatch 'Visual Evidence,Evidence Accepted')"
          visual_run_id="$(jq -r '.id' <<< "$visual_run")"
          artifact_name="beta-visual-evidence-accepted-${RELEASE_SHA}"
          artifacts="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${visual_run_id}/artifacts" \
            -f per_page=100)"
          artifact="$(jq -c --arg name "$artifact_name" '
            [.artifacts[]
              | select(.name == $name and .expired == false and .size_in_bytes > 0)]
            | sort_by(.created_at) | last // empty
          ' <<< "$artifacts")"
          test -n "$artifact"
          echo "visual_run_id=$visual_run_id" >> "$GITHUB_OUTPUT"
          echo "evidence_artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download accepted exact-SHA visual evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.workflows.outputs.evidence_artifact_name }}
          path: accepted-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.workflows.outputs.visual_run_id }}

      - name: Validate accepted evidence manifest and hashes
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.release_sha }}
          EXPECTED_RUN_ID: ${{ steps.workflows.outputs.visual_run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path("accepted-evidence").resolve()
          acceptance = json.loads((root / "accepted-manifest.json").read_text())
          if acceptance.get("accepted") is not True:
              raise SystemExit("evidence is not accepted")
          if acceptance.get("commitSha") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("accepted evidence commit does not match release")
          if str(acceptance.get("sourceRunId")) != os.environ["EXPECTED_RUN_ID"]:
              raise SystemExit("accepted evidence run does not match gated visual run")

          manifest = root / "manifest.json"
          manifest_digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          if manifest_digest != acceptance.get("manifestSha256"):
              raise SystemExit("visual manifest hash mismatch")

          files = acceptance.get("files")
          if not isinstance(files, list) or not files:
              raise SystemExit("accepted evidence has no file hash inventory")
          for item in files:
              path = (root / item["path"]).resolve()
              if root not in path.parents or not path.is_file() or path.is_symlink():
                  raise SystemExit(f"missing or unsafe accepted evidence file: {item['path']}")
              data = path.read_bytes()
              if len(data) != item.get("bytes"):
                  raise SystemExit(f"accepted evidence size mismatch: {item['path']}")
              if hashlib.sha256(data).hexdigest() != item.get("sha256"):
                  raise SystemExit(f"accepted evidence hash mismatch: {item['path']}")

          visual_manifest = json.loads(manifest.read_text())
          entries = visual_manifest.get("entries", [])
          if {entry.get("stepId") for entry in entries} != set(range(1, 30)):
              raise SystemExit("accepted evidence does not cover steps 1..29")
          PY

  build:
    name: Signed APK
    needs: [gate]
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out tagged commit with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Recheck exact main SHA
        if: ${{ needs.gate.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$RELEASE_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_gate != true }}
        run: flutter analyze lib/

      - name: Run tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_gate != true }}
        run: flutter test

      - name: Skip tests (manual skip_gate demo build)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_gate == true }}
        run: echo "Skipping flutter test for skip_gate APK build"

      - name: Decode and verify Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Decode and verify signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"
          test -s "$GITHUB_WORKSPACE/keystore.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          SERVER_URL_DEFINE="${{ github.event_name == 'workflow_dispatch' && inputs.server_url || '' }}"
          if [ -n "$SERVER_URL_DEFINE" ]; then
            flutter build apk --release \
              --dart-define=GRIDGO_REAL_FLOW=true \
              --dart-define=SERVER_URL="$SERVER_URL_DEFINE"
          else
            flutter build apk --release --dart-define=GRIDGO_REAL_FLOW=true
          fi
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Remove decoded signing material after build
        run: |
          rm -f android/app/google-services.json
          rm -f "$GITHUB_WORKSPACE/keystore.jks"

      - name: Name versioned and latest APK assets
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/GRIDGO-${TAG_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GRIDGO-latest.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apks-${{ needs.gate.outputs.release_sha || github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/GRIDGO-*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove decoded signing material if interrupted
        if: always()
        run: |
          rm -f android/app/google-services.json
          rm -f "$GITHUB_WORKSPACE/keystore.jks"

  publisher:
    name: Publish Release
    needs: [gate, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apks-${{ needs.gate.outputs.release_sha || github.sha }}
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: release-assets/GRIDGO-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
