name: Mobile Web E2E CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/mobile/**"
      - "admin/**"
      - "server/**"
      - "e2e/mobile-web/**"
      - "docker/**"
      - "docker-compose.dev.yml"
      - "AGENTS.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  mobile-web-e2e:
    name: Mobile Web E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/mobile-web

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/mobile-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Beta workflow contract
        env:
          MOBILE_WEB_E2E_NO_SERVER: "1"
        run: npm test -- tests/beta-workflow.spec.ts

      - name: Marketplace workflow contract
        env:
          MOBILE_WEB_E2E_NO_SERVER: "1"
        run: npm test -- tests/marketplace-workflow.spec.ts

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-web-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/mobile-web/test-results
            e2e/mobile-web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
