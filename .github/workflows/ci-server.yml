name: Server CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    paths:
      - "server/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: grid_print_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: grid_print_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ci-test-secret
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: grid-print
      MINIO_USE_SSL: false
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Start MinIO for e2e tests
        run: |
          docker run -d --name gridgo-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs gridgo-minio
          exit 1

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
