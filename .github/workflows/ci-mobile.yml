name: Mobile CI

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/

      - name: Run tests
        run: flutter test

      - name: Stub google-services.json for web build
        run: |
          mkdir -p android/app
          echo '{"project_info":{"project_id":"grid-print-85681"},"client":[{"client_info":{"mobilesdk_app_id":"1:3582834609:android:8cb382ce6878312f862f90","android_client_info":{"package_name":"com.example.printing_app"}},"oauth_client":[],"api_key":[],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json

      - name: Build web (verify compilation)
        run: flutter build web --release --no-tree-shake-icons
