name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/

      - name: Run tests
        run: flutter test

      - name: Stub google-services.json for web build
        run: |
          mkdir -p android/app
          echo '{"project_info":{"project_id":"grid-print-85681"},"client":[{"client_info":{"mobilesdk_app_id":"1:3582834609:android:8cb382ce6878312f862f90","android_client_info":{"package_name":"com.example.printing_app"}},"oauth_client":[],"api_key":[],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json

      - name: Build real-flow web release
        run: >-
          flutter build web --release --no-tree-shake-icons
          --dart-define=GRIDGO_REAL_FLOW=true
